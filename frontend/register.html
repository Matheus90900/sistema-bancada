<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Criar Conta</title>
<link rel="stylesheet" href="index.css" />
</head>
<body>

<div class="background"></div>

<canvas id="particles"></canvas>

<div class="login-container">
    <h1>Criar Conta</h1>

    <form>
        <input id="nome" type="text" placeholder="Nome" required />
        <input id="sobrenome" type="text" placeholder="Sobrenome" required />
        <input id="nascimento" type="date" required />
        <input id="email" type="text" placeholder="Email" required>
        <input id="usuario" type="usuario" placeholder="Usuário" required />
        <input id="senha" type="password" placeholder="Senha" required />

        <button type="submit" onclick="createAccount(event)">Criar Conta</button>
    </form>

    <p><a href="index.html">Voltar ao login</a></p>
</div>

<script src="usuario.js"></script>
<script src="particles.js"></script>

</body>
</html>
